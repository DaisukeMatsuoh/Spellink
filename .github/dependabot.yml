# Dependabot: version updates for each part of the project (security alerts and security updates
# are switched on in the repository settings, not here). One pull request per group, weekly, so
# that a quiet week is a quiet inbox. The plugin must stay on the React Native that Supernote's SDK
# was built for: it is never updated by itself (see the ignore list).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /bridge
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /plugin
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    # React Native and React run inside Supernote's app: the plugin must match the version the SDK
    # was built for, so these are never updated by themselves (not even patches). The CLI is only a
    # build tool and may take patches.
    ignore:
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: "@react-native/*"
      - dependency-name: react-test-renderer
      - dependency-name: "@types/react"
      - dependency-name: "@react-native-community/*"
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      plugin-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /bridge
    schedule: {interval: weekly, day: monday}
