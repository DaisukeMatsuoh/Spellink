# Dependabot: version updates for each part of the project (security alerts and security updates
# are switched on in the repository settings, not here). One pull request per group, weekly, so
# that a quiet week is a quiet inbox. The plugin must stay on the React Native that Supernote's SDK
# was built for: only patch releases of it come by themselves.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /bridge
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /plugin
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: react
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "@react-native/*"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react-test-renderer
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      plugin-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /bridge
    schedule: {interval: weekly, day: monday}
