name: bridge

on:
  push:
    branches: [main]
    paths: ['bridge/**', '.github/workflows/bridge.yml']
    tags: ['bridge-v*']
  pull_request:
    paths: ['bridge/**', '.github/workflows/bridge.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - run: go vet ./...
      - name: Test with coverage
        run: go test -race -coverprofile=cover.out ./...
      - name: Coverage summary and gate
        env:
          MIN_COVERAGE: '60'
        run: |
          go tool cover -func=cover.out > cover.txt
          total=$(tail -1 cover.txt | awk '{print $3}' | tr -d '%')
          {
            echo "### Bridge coverage: ${total}%"
            echo
            echo '| package | coverage |'
            echo '|---|---|'
            go test -cover ./... 2>/dev/null | awk '/coverage:/ {print "| " $2 " | " $5 " |"}' | sed 's#github.com/DaisukeMatsuoh/Spellink/bridge/##'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=cover.out -o cover.html
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { if (t+0 < m+0) { print "coverage " t "% is below " m "%"; exit 1 } }'
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-coverage
          path: |
            bridge/cover.out
            bridge/cover.html

  release:
    if: startsWith(github.ref, 'refs/tags/bridge-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - name: Build all targets
        run: scripts/build.sh "${GITHUB_REF_NAME#bridge-v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "spellink-bridge ${GITHUB_REF_NAME#bridge-v}" \
            --notes "Binaries for macOS, Linux and Windows. Verify with SHA256SUMS."
