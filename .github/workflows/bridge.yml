name: bridge

on:
  push:
    branches: [main]
    paths: ['bridge/**', '.github/workflows/bridge.yml', 'docs/spec/**']
    tags: ['bridge-v*']
  # every pull request runs this: required checks must always report (main is protected)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or pull request makes the older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bridge test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  supply-chain:
    name: bridge supply-chain
    # the dependencies are few and pinned (Cargo.lock); this watches them for known holes and for licences
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check
