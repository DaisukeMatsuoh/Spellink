name: edge-image

# Builds the relay / name service image (bridge/Dockerfile.edge) and publishes it to GitHub's
# container registry, so the operator's servers only `docker compose pull` (no Rust, no source,
# no build memory on a small VPS). Runs for a tag `edge-v*`, or by hand.
#
#   git tag edge-v0.1.0 && git push origin edge-v0.1.0
#
# The first publish creates a PRIVATE package: make it public once in the package's settings
# (the program has no secret in it). The servers then pull without a login.

on:
  push:
    tags: ['edge-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # the owner name is lower-cased by the action (the registry needs lower case)
          images: ghcr.io/${{ github.repository_owner }}/spellink-edge
          tags: |
            type=match,pattern=edge-v(.*),group=1
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: bridge
          file: bridge/Dockerfile.edge
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
