name: plugin

on:
  push:
    branches: [main]
    paths: ['plugin/**', 'bridge/**', '.github/workflows/plugin.yml', 'docs/spec/**', 'bridge/testdata/**']
  pull_request:
    paths: ['plugin/**', 'bridge/**', '.github/workflows/plugin.yml', 'docs/spec/**', 'bridge/testdata/**']
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch or pull request makes the older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      # the integration tests build the real bridge and run the plugin's code against it
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint index.js App.tsx src
      - name: Unit tests with coverage
        shell: bash # `bash -eo pipefail`: a failing jest must fail the step, not only tee
        run: npx jest --coverage --coverageReporters=text --coverageReporters=json-summary --coverageReporters=lcov | tee jest.txt
      - name: Coverage summary and gate
        env:
          MIN_COVERAGE: '60'
        run: |
          total=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
          {
            echo "### Plugin coverage (lines): ${total}%"
            echo
            echo '```'
            sed -n '/^---/,$p' jest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node -e "process.exit(${total} < ${MIN_COVERAGE} ? 1 : 0)" || { echo "coverage ${total}% is below ${MIN_COVERAGE}%"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-coverage
          path: plugin/coverage
      - name: Build the plugin package
        run: bash buildPlugin.sh
