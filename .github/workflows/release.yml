name: release

# A tag publishes a release. Tags have no path filter: bridge-vX.Y.Z publishes the bridge for every
# OS, plugin-vX.Y.Z the Supernote plugin. Both are marked as pre-releases while the project is
# an alpha. Nothing is published unless the tests pass and the built program runs.
on:
  push:
    tags: ['bridge-v*', 'plugin-v*']

permissions:
  contents: read

jobs:
  # The bridge carries the plugin package, so that `device add` needs no setup. It is built here,
  # once, and given to every build.
  plugin-package:
    if: startsWith(github.ref_name, 'bridge-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: bash scripts/clean-package.sh "$PWD/build/Spellink-public.snplg"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: plugin/build/Spellink-public.snplg

  bridge:
    needs: plugin-package
    if: startsWith(github.ref_name, 'bridge-v')
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: plugin-package
          path: ${{ runner.temp }}/pkg
      - run: cargo test --locked
      - name: Build
        env:
          SPELLINK_BASE_PACKAGE: ${{ runner.temp }}/pkg/Spellink-public.snplg
        run: scripts/build.sh "${GITHUB_REF_NAME#bridge-v}" ${{ matrix.target }}
      - name: The built program runs, and says the version of the tag
        run: |
          exe=$(ls dist/spellink-bridge-${{ matrix.target }}*)
          got=$("$exe" version)
          want="${GITHUB_REF_NAME#bridge-v}"
          [ "$got" = "$want" ] || { echo "version is '$got', the tag says '$want'"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: bridge/dist/*

  publish-bridge:
    needs: bridge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: The checksums of everything
        run: cd dist && rm -f SHA256SUMS && sha256sum spellink-bridge-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "spellink-bridge ${GITHUB_REF_NAME#bridge-v}" \
            --notes "Pre-release. Binaries for macOS, Linux and Windows; verify with SHA256SUMS. Windows and macOS are not yet verified on real machines. See README.md."

  plugin:
    if: startsWith(github.ref_name, 'plugin-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: dtolnay/rust-toolchain@stable # the integration tests build the real bridge
      - run: npm ci
      - run: npm run typecheck
      - run: npx jest
      - name: Build the plugin package
        run: bash buildPlugin.sh
      - name: The package is there
        run: test -s build/outputs/Spellink.snplg
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum build/outputs/Spellink.snplg > build/outputs/Spellink.snplg.sha256
          gh release create "$GITHUB_REF_NAME" build/outputs/Spellink.snplg build/outputs/Spellink.snplg.sha256 --prerelease \
            --title "Spellink plugin ${GITHUB_REF_NAME#plugin-v}" \
            --notes "Pre-release. This package has no bridge built in: pairing a device with a bridge is not yet possible without building the plugin yourself (see docs/notes/progress/release-plan.md, M3). Install on the device from Settings → Apps → Plugins."
