name: usage

# Once a week: ask each relay for its published counts (GET /v1/stats; ADR 0021), add them to the
# data in docs/usage/data, and rebuild docs/usage/usage-dashboard.md. The relays are listed in
# docs/usage/relays.json; with none listed this does nothing. No credential of a relay is needed:
# what is published is only durations and counts.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test scripts/usage-dashboard.test.mjs
      # the numbers are kept on their own branch, so that the protected default branch is never
      # pushed to by a workflow; what was collected before is brought back first
      - name: bring back the numbers collected so far
        run: |
          if git ls-remote --exit-code --heads origin usage-data >/dev/null 2>&1; then
            git fetch --depth=1 origin usage-data
            git checkout FETCH_HEAD -- docs/usage/data || true
          fi
      - run: node scripts/usage-dashboard.mjs
      - name: publish them on the usage-data branch
        run: |
          if git ls-remote --exit-code --heads origin usage-data >/dev/null 2>&1 && git diff --quiet FETCH_HEAD -- docs/usage 2>/dev/null; then exit 0; fi
          git config user.name "spellink-usage"
          git config user.email "usage@users.noreply.github.com"
          git switch -C usage-data
          git add -f docs/usage
          git commit -m "chore(usage): weekly relay numbers" || exit 0
          git push --force origin usage-data
