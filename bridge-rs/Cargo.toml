[package]
name = "spellink-bridge"
version = "0.0.1"
edition = "2024"
description = "The Spellink bridge and relay"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
rand = "0.9"
sha2 = "0.10"
snow = { version = "0.10", default-features = false, features = ["std", "default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
tokio-util = { version = "0.7", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "process", "fs"] }
tokio-tungstenite = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
tokio-util = { version = "0.7", default-features = false }
tokio = { version = "1", features = ["test-util"] }
