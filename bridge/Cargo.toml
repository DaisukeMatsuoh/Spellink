[package]
name = "spellink-bridge"
version = "0.0.1"
edition = "2024"
description = "The Spellink bridge and relay"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio", "json", "query"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
rand = "0.9"
sha2 = "0.10"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
tokio-util = { version = "0.7", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "process", "fs"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
url = "2.5.9"
if-addrs = "0.15.0"
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider"] }
png = "0.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tokio-util = { version = "0.7", default-features = false }
tokio = { version = "1", features = ["test-util"] }

# Style lints that would only rewrite readable code (closure types in the hooks, nested ifs that
# read like the Go they were ported from). Correctness, suspicious and perf lints stay on.
[lints.clippy]
type_complexity = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
ptr_arg = "allow"
too_many_arguments = "allow"
redundant_closure = "allow"
result_large_err = "allow"
