<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spellink Bridge App</title>
<style>
  body { font: 18px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 40rem; padding: 1rem; color: #111; background: #fff; }
  h1 { font-size: 1.4rem; }
  video { width: 100%; max-height: 60vh; background: #000; border-radius: 8px; }
  #status { min-height: 3rem; font-weight: 600; }
  label { display: block; margin-top: 1.5rem; }
  input { font-size: 1.4rem; letter-spacing: .15em; width: 12em; padding: .3rem; }
  button { font-size: 1.1rem; padding: .4rem 1rem; margin-left: .5rem; }
</style>
</head>
<body>
<h1 id="title">Spellink Bridge App</h1>
<video id="video" playsinline muted></video>
<p id="status" role="status" aria-live="polite"></p>
<label><span id="manualLabel"></span><br>
  <input id="manual" inputmode="numeric" autocomplete="off" maxlength="12"><button id="manualButton" type="button"></button>
</label>
<script src="/pair/pairlogic.js"></script>
<script src="/pair/jsQR.js"></script>
<script src="/pair/pair.js"></script>
<script>
  pairPage.start({
    logic: pairLogic, document: document, navigator: navigator, location: location,
    fetch: window.fetch.bind(window), setTimeout: window.setTimeout.bind(window),
    jsQR: window.jsQR,
    BarcodeDetector: 'BarcodeDetector' in window ? new BarcodeDetector({formats: ['qr_code']}) : null,
  });
</script>
</body>
</html>
