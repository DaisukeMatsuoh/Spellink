[package]
name = "spellink-bridge-rs"
version = "0.0.1"
edition = "2024"
description = "Measurement prototype: the bridge's handwriting core (glyph file, composer, strokes) in Rust, to compare with the Go bridge"
license = "Apache-2.0"
publish = false

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
